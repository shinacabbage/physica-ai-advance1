dataset_root: "../dataset/lerobot_dataset/demoRobot_teleop"
repo_id: "demoRobot_teleop"
output_directory: "../checkpoints/train/demoRobot_teleop_act"
config_path: "configs/car_features.py"

device: "cpu"
training_steps: 2000
log_freq: 1
num_workers: 2
batch_size: 2
chunk_size: 16
# Execute the current command, then replan. The chunk itself still predicts 16 frames.
n_action_steps: 1
learning_rate: 0.0001

# Dataset fps is 20, so one frame is 0.05 s.
# Action[0] is the command to send now. Do not start at -0.1; that offset
# belongs to the 10 Hz PushT/arm example and selects the previous command.
delta_timestamps:
  observation.state: [0.0]
  observation.environment_state: [0.0]
  action: [0.0, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75]
